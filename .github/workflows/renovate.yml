---
name: Renovate

"on":
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Renovate config
        run: npx --yes --package renovate -c renovate-config-validator

  renovate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify RENOVATE_TOKEN is configured
        run: |
          if [ -z "${{ secrets.RENOVATE_TOKEN }}" ]; then
            echo "::error::RENOVATE_TOKEN secret is not set. Create a fine-grained PAT scoped to this repo and add it as a repository secret named RENOVATE_TOKEN before dispatching this workflow."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.20
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
