name: Label Creation

"on":
  push:
    branches:
      - main
    paths:
      - ".github/label_config.yml"
      - ".github/workflows/label_creation.yml"

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run Labeler
        if: success()
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d  # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/label_config.yml
          dry-run: false
          skip-delete: false
