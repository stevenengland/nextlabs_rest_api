---
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: |
          python3 ./tools/checks.py black
        language: system
        types: [python]
        pass_filenames: false

      - id: flake8
        name: flake8
        entry: |
          python3 ./tools/checks.py flake8
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: |
          python3 ./tools/checks.py mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: |
          python3 ./tools/checks.py pyright
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/stevenengland/sten-precommit-hooks
    rev: v0.3.0
    hooks:
      - id: check-mockito
      - id: check-no-basic-config
      - id: check-no-private-import
        args:
          - "--allow=nextlabs_sdk"
          # tests/cli — CLI is the thinnest possible wrapper around _cli
          # internals, so its command tests legitimately drive those directly.
          - "--allow-in-tests=tests/cli/**:nextlabs_sdk._cli"
          # tests/cli — active-account, cache-status and console-io internals
          # have no public re-export; CLI account/auth tests exercise them directly.
          - "--allow-in-tests=tests/cli/**:nextlabs_sdk._auth"
          # tests/cli — CLI command tests stub several CloudAz service/model
          # internals directly; not all have a public re-export yet.
          - "--allow-in-tests=tests/cli/**:nextlabs_sdk._cloudaz"
          # tests/auth — crypto, passphrase, cache-factory, active-account and
          # console-io internals are genuinely white-box; the auth/token-cache
          # tests drive them directly (no public re-export for those).
          - "--allow-in-tests=tests/auth/**:nextlabs_sdk._auth"
          # tests/cloudaz — CloudAz console client/model/engine/request/response
          # internals have no public re-export for every symbol; the cloudaz
          # tests drive them directly.
          - "--allow-in-tests=tests/cloudaz/**:nextlabs_sdk._cloudaz"
          # tests/cloudaz — the envelope wrapper has no public re-export;
          # test_envelope drives it directly.
          - "--allow-in-tests=tests/cloudaz/**:nextlabs_sdk._envelope"
          # tests/cloudaz — the activity-log-query-builder and policy-diff
          # helpers live under _cli for historical reasons but are cloudaz
          # domain logic with no public re-export; their tests drive them
          # directly.
          - "--allow-in-tests=tests/cloudaz/**:nextlabs_sdk._cli"
          # tests/pdp — the JSON/XML XACML serializers, URN constants and
          # token-url resolver have no public re-export; the pdp tests drive
          # them directly.
          - "--allow-in-tests=tests/pdp/**:nextlabs_sdk._pdp"
          # tests/pagination — the paginated-endpoint engine (specs, runners,
          # assembly, dialects) and the component-name-entry model have no
          # public re-export; the pagination/engine tests drive them directly.
          - "--allow-in-tests=tests/pagination/**:nextlabs_sdk._cloudaz"
          # tests/search — SavedSearchType, SortField and SortOrder have no
          # public re-export; the search-model tests drive them directly.
          - "--allow-in-tests=tests/search/**:nextlabs_sdk._cloudaz._search"
          # tests/transport — RetryTransport/AsyncRetryTransport have no
          # public re-export; the transport tests drive them directly.
          - "--allow-in-tests=tests/transport/**:nextlabs_sdk._http_transport"
          # tests/transport — LoggingTransport has no public re-export; the
          # transport-logging tests drive it directly.
          - "--allow-in-tests=tests/transport/**:nextlabs_sdk._http_transport_logging"
          # tests/transport — AsyncLoggingTransport has no public re-export;
          # the transport-logging tests drive it directly.
          - "--allow-in-tests=tests/transport/**:nextlabs_sdk._http_transport_logging_async"
          # tests/transport — RetryPolicy has no public re-export; the
          # retry-policy tests drive it directly.
          - "--allow-in-tests=tests/transport/**:nextlabs_sdk._retry_policy"
          # tests/transport — decode_json/require_key have no public
          # re-export; the json-response tests drive them directly.
          - "--allow-in-tests=tests/transport/**:nextlabs_sdk._json_response"
          # tests/openapi — the vendor-spec loader, example-case collector and
          # model-parity helpers are private test tooling, not an SDK
          # internal; the openapi area's white-box tests drive them directly.
          - "--allow-in-tests=tests/openapi/**:tests.openapi._openapi"
          # tests/openapi — Dependency, DeploymentResult and ComponentType
          # have no public re-export; the model-registry lookup drives them
          # directly.
          - "--allow-in-tests=tests/openapi/**:nextlabs_sdk._cloudaz"
          # tests/e2e — the WireMock stub-mapping builder is private e2e test
          # tooling with no public surface; the e2e tests drive it directly.
          - "--allow-in-tests=tests/e2e/**:tests.e2e._stubs"
          # tests/e2e — the stub bearer-auth and PDP-token-stub helpers are
          # private e2e test tooling with no public surface; the e2e tests
          # drive them directly.
          - "--allow-in-tests=tests/e2e/**:tests.e2e._support"
          # tests/e2e — stub-mapping construction reuses the openapi area's
          # example-case helpers so WireMock stubs stay derived from the same
          # vendor-spec fixtures.
          - "--allow-in-tests=tests/e2e/**:tests.openapi._openapi"
          # tests/architecture — the invariant tests assert closure over the
          # real internal CLI modules (contexts, resolvers, cache-key
          # helpers), so they legitimately drive _cli directly.
          - "--allow-in-tests=tests/architecture/**:nextlabs_sdk._cli"
          # tests/architecture — the invariant tests introspect CloudAz
          # engine/search/model internals, and some assert identity against
          # their public re-export, so they legitimately drive _cloudaz
          # directly.
          - "--allow-in-tests=tests/architecture/**:nextlabs_sdk._cloudaz"
          # tests/architecture — ActiveAccount and the account/cache-key
          # contracts it pins have no public re-export; the invariant tests
          # legitimately drive _auth directly.
          - "--allow-in-tests=tests/architecture/**:nextlabs_sdk._auth"
          # tests/architecture — kept for the pagination primitives'
          # white-box coverage; current invariant tests resolve
          # AsyncPaginator/SyncPaginator from the public nextlabs_sdk facade.
          - "--allow-in-tests=tests/architecture/**:nextlabs_sdk._pagination"